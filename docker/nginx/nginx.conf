# Rate limiting — descomentado en producción.
# Requiere ajustar el valor según capacidad del nodo (aquí: 500 req/s por IP, burst 1000).
# limit_req_zone $binary_remote_addr zone=search:10m rate=500r/s;

server {
    listen 80;
    server_name _;
    root /app/public;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location /search {
        # limit_req zone=search burst=1000 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
