parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Every PlanProvider implementation is collected under one tag so the sync can iterate all of
    # them. Adding a second provider = a new tagged service here, no change to the use case.
    _instanceof:
        App\Application\Provider\PlanProvider:
            tags: ['app.plan_provider']

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Application\Provider\PlanProvider: '@App\Infrastructure\Provider\Http\HttpPlanProvider'

    App\Domain\Event\EventRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineEventRepository'

    # Controller gets the caching decorator; inner store is DoctrineEventFinder.
    App\Application\Search\EventFinder: '@App\Infrastructure\Cache\CachingEventFinder'

    App\Infrastructure\Cache\CachingEventFinder:
        arguments:
            $inner: '@App\Infrastructure\Persistence\Doctrine\DoctrineEventFinder'
            $cache: '@search.cache'

    App\Application\Sync\SyncPlansUseCase:
        arguments:
            $providers: !tagged_iterator app.plan_provider

    App\Infrastructure\Provider\Http\HttpPlanProvider:
        arguments:
            $baseUrl: '%env(PROVIDER_BASE_URL)%'
            $timeout: '%env(float:PROVIDER_TIMEOUT)%'
