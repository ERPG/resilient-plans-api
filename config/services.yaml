parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Every PlanProvider implementation is collected under one tag so the sync can iterate all of
    # them. Adding a second provider = a new tagged service here, no change to the use case.
    _instanceof:
        App\Application\Provider\PlanProvider:
            tags: ['app.plan_provider']

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Application\Provider\PlanProvider: '@App\Infrastructure\Provider\Http\FeverUpPlanProvider'

    App\Domain\Event\EventRepository: '@App\Infrastructure\Persistence\Doctrine\DoctrineEventRepository'

    App\Application\Search\EventFinder: '@App\Infrastructure\Persistence\Doctrine\DoctrineEventFinder'

    App\Application\Sync\SyncPlansUseCase:
        arguments:
            $providers: !tagged_iterator app.plan_provider

    App\Infrastructure\Provider\Http\FeverUpPlanProvider:
        arguments:
            $baseUrl: '%env(PROVIDER_BASE_URL)%'
            $timeout: '%env(float:PROVIDER_TIMEOUT)%'
