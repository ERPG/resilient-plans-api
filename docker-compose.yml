services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://app:app@db:5432/plans?serverVersion=16"
      REDIS_URL: "redis://redis:6379"
      APP_ENV: prod
    command: sh -c "composer install --no-interaction && php bin/console doctrine:migrations:migrate --no-interaction && php bin/console cache:warmup && php-fpm"

  nginx:
    image: nginx:alpine
    volumes:
      - .:/app
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    depends_on:
      - app

  # Sin servicio `sync`: `app:sync-plans` es agnóstico del disparo (lo invoca el scheduler del
  # entorno en prod; `make sync` en local). Razonamiento en el README ("Provider integration").

  redis:
    image: redis:7-alpine
    # Pure cache: evict oldest under memory pressure, never reject writes.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plans
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      # Host 5433 (5432 may be taken by a local Postgres); inside the network it's still db:5432.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d plans"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
