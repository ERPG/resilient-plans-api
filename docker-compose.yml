services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fever_app
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://app:app@db:5432/fever?serverVersion=16"
    command: sh -c "composer install --no-interaction && php bin/console doctrine:migrations:migrate --no-interaction && php-fpm"

  nginx:
    image: nginx:alpine
    container_name: fever_nginx
    volumes:
      - .:/app
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    depends_on:
      - app

  # Sin servicio `sync`: `app:sync-plans` es agnóstico del disparo (lo invoca el scheduler del
  # entorno en prod; `make sync` en local). Racionalidad en README.private.md.

  db:
    image: postgres:16-alpine
    container_name: fever_db
    environment:
      POSTGRES_DB: fever
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      # Host 5433 (5432 may be taken by a local Postgres); inside the network it's still db:5432.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d fever"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
